services:
  app:
    build: .
    image: portofolio:latest
    container_name: portofolio-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"          # Map host APP_PORT -> 80 container
    environment:
      APP_NAME: ${APP_NAME:-Portofolio}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-error}

      # Koneksi DB eksternal/shared (mis. MySQL di server lain)
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-db_portofolio}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}

      # Seeder (false dianjurkan di prod / DB bersama)
      DB_SEED: ${DB_SEED:-false}

      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
    volumes:
      - app-storage:/var/www/html/storage/app/public

volumes:
  app-storage: